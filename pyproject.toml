[build-system]
requires = ["setuptools >= 80", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "modular_simulation.measurables.process_model",
  "modular_simulation.plotting.time_series",
  "modular_simulation.cli.backend_session",
  "modular_simulation.components.control_system.controllers.bang_bang",
  "modular_simulation.components.control_system.trajectory",
    "modular_simulation.connection.domain.domain_contracts",
    "modular_simulation.connection.domain.invariant_validator",
    "modular_simulation.connection.topology.subsystem_descriptor",
    "modular_simulation.connection.runtime.thermo_coupling",
  "modular_simulation.flowsheet.flowsheet",
  "modular_simulation.framework.system",
  "modular_simulation.thermodynamics.property_package",
  "modular_simulation.unit_processes.separation.component_separator",
  "modular_simulation.unit_processes.reactors.conversion_reactor",
  "modular_simulation.unit_processes.reactors.cstr",
  "modular_simulation.unit_processes.separation.flash_drum",
  "modular_simulation.utils",
  "modular_simulation.utils.bounded_minimize",
]
ignore_errors = true

[project]
name = "modular-simulation"
version = "0.1.0"
license = "MIT"
authors = [
  { name = "Alden Olyniec", email = "aldenliuolyniec@gmail.com" },
]
description = "Modular simulation framework for easily defining measurable and controllable systems."
readme = "docs/README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
  "Programming Language :: Python :: 3",
]

dependencies = [
  "scipy",
  "tqdm",
  "pydantic",
  "matplotlib",
  "astropy",
  "nicegui",
  "thermo>=0.3.0",
  "chemicals>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

[dependency-groups]
dev = [
  "basedpyright>=1.37.2",
  "ruff",
  "pytest",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools]
exclude-package-data = { "*" = [".sisyphus/*", "checkpt.pkl", "*.Zone.Identifier"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modular_simulation = ["py.typed"]
