[build-system]
requires = ["setuptools >= 80", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "measurables.process_model",
  "plotting.time_series",
]
ignore_errors = true

[project]
name = "modular-simulation"
version = "0.1.0"
license = { text = "MIT" }
authors = [
  { name = "Alden Olyniec", email = "aldenliuolyniec@gmail.com" },
]
description = "Modular simulation framework for easily defining measurable and controllable systems."
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  "scipy",
  "tqdm",
  "pydantic",
  "matplotlib",
  "astropy",
  "nicegui",
  "thermo>=0.3.0",
  "chemicals>=1.2.0",
  "pytest",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

[dependency-groups]
dev = [
  "basedpyright>=1.37.2",
  "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
