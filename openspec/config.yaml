schema: modsim-contract
context: |
  ModularSimulator is a chemical-process simulation project being built to support a serious process-optimization game while also standing on its own as a reasonably high-fidelity simulation substrate.

  The project is not just a generic simulator and not just a frontend game client. It combines a reusable simulation core with higher-level gameplay, service, and client layers.

  The long-term product should be both educationally valuable and fun in its own right. The core gameplay loop is to accumulate capital, improve an existing plant through control and process optimization, increase profitability, and repeat.

  Being educational does NOT serve as an excuse to make gross compromise in realism; educational value comes from *how the scenarios are setup* and NOT how this repo implements the first principles. 

  Heuristics or emperical laws may be used to approximate complex phenomena, but they should be clearly documented and justified in the design record. The goal is to strike a balance between realism and simulation stability and speed.
  
  Player guidance should keep people from feeling lost without replacing the optimization game with a rigid script. Progress is expected to be driven primarily by gradual unlocks tied to production and economic milestones, with guided tutorial scenarios available as an optional onboarding layer.

  The architecture separates low-level simulation and plant-runtime concerns—such as flowsheet topology and hydraulic/runtime behavior—from higher-level gameplay, economy, and client concerns.

  The primary implementation stack is Python with Pydantic, FastAPI/Uvicorn, SciPy, Astropy, and thermo/chemicals, with a Godot client layer on top.

  OpenSpec is the durable contract for requirements, design intent, delta specs, and change planning.
  Beads is the live execution ledger for status, blockers, notes, and discovered work.
  Use `tasks.md` as the planning breakdown and `beads-identity.md` as the OpenSpec-to-Beads linkage record.

rules:
  proposal:
    - Use plain language. Prefer direct, concrete wording over jargon, abstract labels, or vague framework terms.
    - Call out when a capability needs equation-bearing specs so changepack review does not lose the governing model form.
  specs:
    - Organize domain specs under `openspec/specs/` by durable capability domain, not by work item or release milestone.
    - Describe observable behavior and acceptance criteria, not implementation internals.
    - When a requirement depends on scientific, mathematical, thermodynamic, hydraulic, control, or economic model form, include the governing equations, symbol definitions, closures, and named assumptions in the spec instead of relying on prose alone.
  design:
    - Record explicit decisions, risks, trade-offs, and verification strategy.
    - Preserve equation provenance, named correlations, simplifying assumptions, and justification whenever the spec depends on scientific or mathematical model form.
  tasks:
    - Treat `tasks.md` as the planning breakdown, not the live execution ledger.
    - Organize work into dependency gates and execution waves with concrete verification commands and expected evidence.
  beads-identity:
    - Record the linked Beads epic ID, child task IDs, sync note, and a clear statement that Beads is the live execution ledger.
