schema: spec-driven
context: |
  ModularSimulator is a chemical-process simulation project being built to support a serious process-optimization game while also standing on its own as a reasonably high-fidelity simulation substrate.

  The project is not just a generic simulator and not just a frontend game client. It combines a reusable simulation core with higher-level gameplay, service, and client layers.

  The long-term product should be both educationally valuable and fun in its own right. The core gameplay loop is to accumulate capital, improve an existing plant through control and process optimization, increase profitability, and repeat.

  Player guidance should keep people from feeling lost without replacing the optimization game with a rigid script. Progress is expected to be driven primarily by gradual unlocks tied to production and economic milestones, with guided tutorial scenarios available as an optional onboarding layer.

  The architecture separates low-level simulation and plant-runtime concerns—such as flowsheet topology and hydraulic/runtime behavior—from higher-level gameplay, economy, and client concerns.

  The primary implementation stack is Python with Pydantic, FastAPI/Uvicorn, SciPy, Astropy, and thermo/chemicals, with a Godot client layer on top.

  OpenSpec is the source of truth for requirements and acceptance criteria. Beads tracks execution work.
