name: modsim-contract
version: 1
description: Modsim OpenSpec contract with Beads linkage for execution
artifacts:
  - id: proposal
    generates: proposal.md
    description: Change intent and scope
    template: proposal.md
    instruction: |
      Create `proposal.md`.

      Cover:
      - **Why**: why this change matters now.
      - **What Changes**: concrete scope, additions, removals, or constraints.
      - **Capabilities**: exact capability specs to add or modify.
      - **Impact**: affected code, APIs, dependencies, systems, or workflows.

      Keep it concise. Keep it contract-level. Do not drift into implementation detail.
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: Delta specs for changed capabilities
    template: spec.md
    instruction: |
      Create the delta specs that define observable behavior.

      Create one spec file per capability named in the proposal.
      Use `ADDED`, `MODIFIED`, `REMOVED`, and `RENAMED` sections exactly.
      Keep requirements testable.
      Use `#### Scenario:` headings and concrete WHEN/THEN outcomes.
      For `MODIFIED` requirements, copy the full current requirement block before editing it.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design and verification strategy
    template: design.md
    instruction: |
      Create `design.md`.

      Cover:
      - current context and constraints
      - goals and non-goals
      - key decisions and rejected alternatives when they matter
      - referenced sources or related work when they matter
      - risks and trade-offs
      - migration or rollout notes when needed
      - verification strategy with concrete commands when known

      Focus on decisions that guide implementation. Keep the document narrow and specific.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Execution-ready planning breakdown
    template: tasks.md
    instruction: |
      Create `tasks.md` as the planning breakdown for implementation.

      Rules:
      - Keep the file execution-ready.
      - Use a dependency gate first.
      - Organize work into numbered waves.
      - Use checkbox items for readability and archive summaries.
      - Name exact files when known.
      - Add verification commands and expected evidence.
      - State when TDD should lead implementation.
      - Add `simulation-realism-required: true` inside the relevant task text when the change affects simulation behavior, thermodynamics, flow behavior, controls, chemistry, named engineering heuristics, or rough engineering economics.

      This file is not the live execution ledger. Beads owns live status during apply.
    requires:
      - specs
      - design

  - id: beads-identity
    generates: beads-identity.md
    description: Linkage between the OpenSpec change and Beads execution items
    template: beads-identity.md
    instruction: |
      Create `beads-identity.md`.

      Record:
      - the OpenSpec change name
      - the linked Beads epic ID
      - the linked Beads child task IDs
      - the mapping from planning waves to Beads items
      - the last sync note or timestamp
      - a clear statement that Beads is the live execution ledger

      Do not leave placeholder IDs once planning is ready for execution.
    requires:
      - tasks

apply:
  requires:
    - tasks
    - beads-identity
  tracks: null
  instruction: |
    Read all context files.
    Use `tasks.md` as the planning breakdown.
    Use `beads-identity.md` to resolve linked Beads work.
    Treat Beads as the live execution ledger for status, blockers, and notes.
    Route back to planning if the contract is incomplete or contradicted by implementation.
